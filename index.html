<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/img/ONLY_LOGO.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HuellarioSoft - Sistema de gestión veterinaria profesional" />
    <title>HuellarioSoft - Gestión Veterinaria</title>
    
    <!-- Aplicar tema antes de renderizar para evitar flash de contenido -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme')
        const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (isDark) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
